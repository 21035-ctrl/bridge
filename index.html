<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ซ้อมบริดจ์</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ซ้อมบริดจ์">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#17110e">
<meta property="og:title" content="ซ้อมบริดจ์">
<meta property="og:type" content="website">
<meta property="og:image" content="https://21035-ctrl.github.io/bridge/icon-192.png">
<style>
  :root{color-scheme:light dark;--bg:#0f3d2e;--fg:#f4f1e8;--muted:#b9c7bf}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,"Noto Sans Thai",sans-serif;padding:16px;box-sizing:border-box}
  p{margin:0;text-align:center}small{color:var(--muted)}a{color:inherit}
</style>
</head>
<body>
<p id="msg"></p>
<script>
// Sends visitors to the server on the host computer when it is up, otherwise to the Render copy.
const FALLBACK='https://keekiadbridge.onrender.com';
// Text appears only for a slow connection, so link previews show no description.
setTimeout(()=>{document.getElementById('msg').innerHTML='กำลังเปิดโต๊ะ…<br><small>รอนาน? <a href="'+FALLBACK+'">เข้าเว็บสำรอง</a></small>'},1500);
const go=url=>location.replace(url+location.search+location.hash);
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),ms))]);
(async()=>{
  try{
    // The GitHub API has the address the moment the host publishes it; the Pages copy lags a few minutes.
    const fromApi=()=>fetch('https://api.github.com/repos/21035-ctrl/bridge/contents/url.json',{cache:'no-store',headers:{Accept:'application/vnd.github.raw+json'}}).then(r=>{if(!r.ok)throw 0;return r.json()});
    const fromPages=()=>fetch('url.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json());
    const {url}=await withTimeout(fromApi().catch(fromPages),5000);
    if(url){const ok=await withTimeout(fetch(url+'/api/ping',{cache:'no-store'}).then(r=>r.ok),6000);if(ok)return go(url);}
  }catch{}
  go(FALLBACK);
})();
</script>
</body>
</html>
